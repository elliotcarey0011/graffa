services:
  app:
    build: .
    restart: unless-stopped
    environment:
      - PORT=8787
      - DATA_DIR=/data
    volumes:
      - ./data:/data
    # No ports published to the host — only reachable from the caddy service
    # over the compose network, so the WS/HTTP port is never exposed directly.

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
